name: Deploy Backend to Azure Web App

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build backend/backend.csproj --configuration Release

      - name: Replace placeholders in appsettings.json
        run: |
          sed -i "s/\${DB_HOST}/${{ secrets.DB_HOST }}/g" backend/appsettings.json
          sed -i "s/\${DB_PORT}/${{ secrets.DB_PORT }}/g" backend/appsettings.json
          sed -i "s/\${DB_USER}/${{ secrets.DB_USER }}/g" backend/appsettings.json
          sed -i "s/\${DB_PASS}/${{ secrets.DB_PASS }}/g" backend/appsettings.json

      - name: dotnet publish
        run: dotnet publish backend/backend.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{env.DOTNET_ROOT}}/myapp
